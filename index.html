<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#060912" />
<title>高速延长 · 综合管理平台</title>
<meta name="description" content="高速延长公司非油业务驾驶舱与系统统一入口" />
<style>
  :root{
    --bg:#060912; --bg2:#0a0f1f;
    --text:#e8edf7; --muted:#94a3c0;
    --gold:#f5b942; --gold2:#ffd27a; --blue:#4ea8ff; --red:#e23b3b;
    --card:rgba(255,255,255,.045); --card-border:rgba(255,255,255,.09);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden;
    position:relative; -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  /* ===== 背景层 ===== */
  .bg{position:fixed;inset:0;z-index:-5;background:
      radial-gradient(1200px 700px at 15% -10%, rgba(245,185,66,.16), transparent 60%),
      radial-gradient(1000px 700px at 95% 8%, rgba(78,168,255,.15), transparent 55%),
      radial-gradient(900px 600px at 50% 110%, rgba(226,59,59,.10), transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2));}
  #fx{position:fixed;inset:0;z-index:-4;pointer-events:none}
  .blob{position:fixed;z-index:-3;border-radius:50%;filter:blur(72px);opacity:.5;animation:float 20s ease-in-out infinite}
  .blob.a{width:420px;height:420px;left:-80px;top:-60px;background:radial-gradient(circle,rgba(245,185,66,.5),transparent 70%)}
  .blob.b{width:480px;height:480px;right:-120px;top:40px;background:radial-gradient(circle,rgba(78,168,255,.45),transparent 70%);animation-delay:-6s}
  .blob.c{width:360px;height:360px;left:40%;bottom:-140px;background:radial-gradient(circle,rgba(226,59,59,.30),transparent 70%);animation-delay:-11s}
  .grid{position:fixed;inset:0;z-index:-2;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(circle at 50% 32%,#000 0%,transparent 78%);
            mask-image:radial-gradient(circle at 50% 32%,#000 0%,transparent 78%);}
  .spotlight{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(420px circle at var(--x,50%) var(--y,18%), rgba(245,185,66,.10), transparent 62%);}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,40px) scale(1.08)}66%{transform:translate(-25px,20px) scale(.95)}}

  .wrap{max-width:1120px;margin:0 auto;padding:56px 24px 56px;position:relative;z-index:1}
  /* ===== 品牌（透明 logo 悬浮） ===== */
  header{text-align:center;margin-bottom:44px}
  .brand{position:relative;display:inline-block;margin-bottom:18px;animation:floaty 7.5s ease-in-out infinite;isolation:isolate}
  .brand-glow{position:absolute;inset:-12% -9%;z-index:-1;border-radius:50%;
    background:radial-gradient(closest-side,rgba(245,185,66,.22),rgba(78,168,255,.12) 55%,transparent 76%);
    filter:blur(30px);animation:pulse 6s ease-in-out infinite}
  .brand-img{display:block;width:min(410px,76vw);height:auto;user-select:none;-webkit-user-drag:none;
    filter:drop-shadow(0 0 1.2px rgba(0,0,0,.92)) drop-shadow(0 14px 26px rgba(0,0,0,.5)) drop-shadow(0 0 22px rgba(120,170,255,.10));
    transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .brand:hover .brand-img{transform:scale(1.03) translateY(-3px)}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes pulse{0%,100%{opacity:.42;transform:scale(1)}50%{opacity:.72;transform:scale(1.05)}}

  h1{font-size:34px;font-weight:800;letter-spacing:2px;
     background:linear-gradient(100deg,var(--gold2),var(--gold) 28%,var(--blue) 60%,var(--gold2));
     background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
     animation:shifthue 9s linear infinite;filter:drop-shadow(0 4px 20px rgba(245,185,66,.18))}
  @keyframes shifthue{to{background-position:220% 0}}
  .sub{color:var(--muted);margin-top:10px;font-size:15px;letter-spacing:.5px}
  .tag{display:inline-block;margin-top:16px;padding:6px 14px;border:1px solid var(--card-border);border-radius:999px;
       font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.03);backdrop-filter:blur(6px)}
  .tag b{color:var(--gold2);font-weight:700}

  /* ===== 卡片 ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
  .card{position:relative;display:block;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
    padding:24px 22px;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transform:perspective(760px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .22s ease, border-color .35s, box-shadow .35s;
    opacity:0; translate:0 22px; animation:fadeIn .7s ease forwards; will-change:transform}
  .card::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;
    background:linear-gradient(90deg,var(--gold),var(--red),var(--blue));opacity:0;transition:opacity .35s}
  .card:hover{border-color:rgba(245,185,66,.5);
    box-shadow:0 20px 55px -20px rgba(245,185,66,.42), 0 0 0 1px rgba(245,185,66,.16) inset}
  .card:hover::before{opacity:1}

  /* 图标底座 + 渐变线条图标 */
  .icon{position:relative;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,rgba(245,185,66,.16),rgba(78,168,255,.12));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 10px 22px -12px rgba(0,0,0,.6);
    margin-bottom:16px;overflow:hidden;transition:transform .35s, box-shadow .35s}
  .icon::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 30% 0%,rgba(255,255,255,.20),transparent 60%)}
  .icon svg{width:26px;height:26px;position:relative;z-index:1}
  .card:hover .icon{transform:scale(1.09) rotate(-5deg);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 16px 28px -10px rgba(245,185,66,.42)}

  .card h3{font-size:18.5px;font-weight:700;letter-spacing:.5px}
  .card p{color:var(--muted);font-size:13.5px;margin-top:7px;min-height:38px}
  .meta{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
  .chip{font-size:11.5px;padding:4px 10px;border-radius:999px;letter-spacing:.5px;
    background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--card-border)}
  .chip.dash{color:var(--gold2);border-color:rgba(245,185,66,.35)}
  .chip.biz{color:var(--blue);border-color:rgba(78,168,255,.35)}
  .enter{font-size:13.5px;font-weight:600;color:var(--gold2);display:inline-flex;align-items:center;gap:5px;transition:gap .3s}
  .card:hover .enter{gap:10px}
  .enter svg{width:15px;height:15px}

  footer{text-align:center;margin-top:54px;color:var(--muted);font-size:12.5px;letter-spacing:.5px}
  footer .line{width:60px;height:1px;background:var(--card-border);margin:0 auto 16px}
  .credit{margin-top:9px;font-size:11.5px;color:rgba(148,163,192,.68);letter-spacing:.3px}
  .credit a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(148,163,192,.28)}
  .credit a:hover{color:var(--gold2);border-color:var(--gold2)}

  @keyframes fadeIn{from{opacity:0;translate:0 22px}to{opacity:1;translate:0 0}}
  .cards .card:nth-child(1){animation-delay:.05s}
  .cards .card:nth-child(2){animation-delay:.12s}
  .cards .card:nth-child(3){animation-delay:.19s}
  .cards .card:nth-child(4){animation-delay:.26s}
  .cards .card:nth-child(5){animation-delay:.33s}
  .cards .card:nth-child(6){animation-delay:.40s}
  .cards .card:nth-child(7){animation-delay:.47s}
  .cards .card:nth-child(8){animation-delay:.54s}

  @media (max-width:520px){h1{font-size:26px}.wrap{padding:42px 18px 44px}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .card{opacity:1;translate:0 0}
    #fx{display:none}
  }
</style>
</head>
<body>
  <!-- 图标渐变描边定义 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="icoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#f5b942"/>
      <stop offset="1" stop-color="#4ea8ff"/>
    </linearGradient>
  </defs></svg>

  <div class="bg"></div>
  <canvas id="fx"></canvas>
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
  <div class="grid"></div>
  <div class="spotlight" id="spot"></div>

  <div class="wrap">
    <header>
      <div class="brand">
        <div class="brand-glow"></div>
        <img class="brand-img" src="./brand2.png" alt="陕西交控 × 延长石油" />
      </div>
      <h1>高速延长 · 综合管理平台</h1>
      <div class="sub">业务驾驶舱与系统 · 统一入口</div>
      <div class="tag">共 <b id="cnt">0</b> 个系统 · 一键直达</div>
    </header>

    <main class="cards" id="cards"></main>

    <footer>
      <div class="line"></div>
      内部导航 · 仅限授权人员访问 · 高速延长非油业务
      <div class="credit">Design by 刘龙伟 · Email: <a href="mailto:liulongwei@126.com">liulongwei@126.com</a></div>
    </footer>
  </div>

<script>
  /* ===== 入口数据：新增/修改在这里改 ===== */
  const SITES = [
    { name:"陕西高速油站分布", desc:"加油站综合业务总驾驶舱（多用户后端）", cat:"驾驶舱", catType:"dash",
      url:"https://sx-gas-station-dashboard.app.workbuddy.host",
      icon:'<rect x="3" y="3" width="7" height="9" rx="1.6"/><rect x="14" y="3" width="7" height="5" rx="1.6"/><rect x="14" y="12" width="7" height="9" rx="1.6"/><rect x="3" y="16" width="7" height="5" rx="1.6"/>' },
    { name:"成品油销量驾驶舱", desc:"成品油销量·双口径·站点排行·会计月轨迹", cat:"驾驶舱", catType:"dash",
      url:"https://lvritiann.github.io/youpin-sales-cockpit/",
      icon:'<rect x="3" y="12" width="4.6" height="9" rx="1.2"/><rect x="9.7" y="6" width="4.6" height="15" rx="1.2"/><rect x="16.4" y="9.5" width="4.6" height="11.5" rx="1.2"/>' },
    { name:"非油综合汇总驾驶舱", desc:"非油销售·毛利·全年预测图表视图", cat:"驾驶舱", catType:"dash",
      url:"https://lvritiann.github.io/feiyou-cockpit-web/",
      icon:'<path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>' },
    { name:"油品管理驾驶舱", desc:"油品损耗监控、分析与预警", cat:"驾驶舱", catType:"dash",
      url:"https://lvritiann.github.io/troleum-loss-dashboard/",
      icon:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>' },
    { name:"进销存管理系统", desc:"进货·销售·库存·盘点一体化管理", cat:"业务系统", catType:"biz",
      url:"https://lvritiann.github.io/jinxiaocun-cockpit/",
      icon:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>' },
    { name:"供应商订货系统", desc:"非油订货·额度管控·到货入库", cat:"业务系统", catType:"biz",
      url:"https://lvritiann.github.io/dinghuo-taizhang/",
      icon:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M8 11h8"/><path d="M8 15h6"/>' }
  ];

  const arrow = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m0 0-6-6m6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const wrap = document.getElementById('cards');
  wrap.innerHTML = SITES.map(s => `
    <a class="card" href="${s.url}" target="_blank" rel="noopener noreferrer">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="url(#icoGrad)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg></div>
      <h3>${s.name}</h3>
      <p>${s.desc}</p>
      <div class="meta">
        <span class="chip ${s.catType}">${s.cat}</span>
        <span class="enter">进入系统 ${arrow}</span>
      </div>
    </a>`).join('');
  document.getElementById('cnt').textContent = SITES.length;

  /* ===== 减少动效偏好 ===== */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===== 鼠标聚光 + 粒子连线 ===== */
  const spot = document.getElementById('spot');
  const mouse = { x: innerWidth/2, y: 120 };
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    spot.style.setProperty('--x', e.clientX + 'px');
    spot.style.setProperty('--y', e.clientY + 'px');
  }, { passive:true });

  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W, H, ps = [];
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  function resize(){
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const n = Math.min(84, Math.floor(W*H/20000));
    ps = [];
    for (let i=0;i<n;i++) ps.push({ x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.32, vy:(Math.random()-.5)*.32, r:Math.random()*1.5+.5 });
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for (const p of ps){
      p.x += p.vx; p.y += p.vy;
      if (p.x<0||p.x>W) p.vx*=-1;
      if (p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832);
      ctx.fillStyle = 'rgba(180,205,255,.55)'; ctx.fill();
    }
    for (let i=0;i<ps.length;i++){
      const a = ps[i];
      for (let j=i+1;j<ps.length;j++){
        const b = ps[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
        if (d<128){
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
          ctx.strokeStyle = 'rgba(120,170,255,'+(0.13*(1-d/128))+')'; ctx.lineWidth=1; ctx.stroke();
        }
      }
      const dx=a.x-mouse.x, dy=a.y-mouse.y, dm=Math.hypot(dx,dy);
      if (dm<170){
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(mouse.x,mouse.y);
        ctx.strokeStyle = 'rgba(245,185,66,'+(0.20*(1-dm/170))+')'; ctx.lineWidth=1; ctx.stroke();
      }
    }
    requestAnimationFrame(tick);
  }
  if (!reduce){ resize(); tick(); window.addEventListener('resize', resize); }

  /* ===== 卡片 3D 跟随 ===== */
  if (!reduce && matchMedia('(hover:hover)').matches){
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        const rx = ((e.clientY - r.top)/r.height - .5) * -7;
        const ry = ((e.clientX - r.left)/r.width - .5) * 7;
        card.style.setProperty('--rx', rx.toFixed(2)+'deg');
        card.style.setProperty('--ry', ry.toFixed(2)+'deg');
      });
      card.addEventListener('mouseleave', () => {
        card.style.setProperty('--rx','0deg');
        card.style.setProperty('--ry','0deg');
      });
    });
  }
</script>
</body>
</html>
