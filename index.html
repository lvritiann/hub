<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#060912" />
<title>高速延长 · 综合管理平台</title>
<meta name="description" content="高速延长公司非油业务驾驶舱与系统统一入口" />
<!-- PWA：让鸿蒙 / 安卓浏览器可以「添加到桌面」，获得接近 App 的独立图标体验 -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="综合管理平台" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root{
    --bg:#060912; --bg2:#0a0f1f;
    --text:#e8edf7; --muted:#94a3c0;
    --gold:#f5b942; --gold2:#ffd27a; --blue:#4ea8ff; --red:#e23b3b;
    --card:rgba(255,255,255,.045); --card-border:rgba(255,255,255,.09);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden;
    position:relative; -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  /* ===== 背景层 ===== */
  .bg{position:fixed;inset:0;z-index:-5;background:
      radial-gradient(1200px 700px at 15% -10%, rgba(245,185,66,.16), transparent 60%),
      radial-gradient(1000px 700px at 95% 8%, rgba(78,168,255,.15), transparent 55%),
      radial-gradient(900px 600px at 50% 110%, rgba(226,59,59,.10), transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2));}
  #fx{position:fixed;inset:0;z-index:-4;pointer-events:none}
  .blob{position:fixed;z-index:-3;border-radius:50%;filter:blur(72px);opacity:.5;animation:float 20s ease-in-out infinite}
  .blob.a{width:420px;height:420px;left:-80px;top:-60px;background:radial-gradient(circle,rgba(245,185,66,.5),transparent 70%)}
  .blob.b{width:480px;height:480px;right:-120px;top:40px;background:radial-gradient(circle,rgba(78,168,255,.45),transparent 70%);animation-delay:-6s}
  .blob.c{width:360px;height:360px;left:40%;bottom:-140px;background:radial-gradient(circle,rgba(226,59,59,.30),transparent 70%);animation-delay:-11s}
  .grid{position:fixed;inset:0;z-index:-2;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(circle at 50% 32%,#000 0%,transparent 78%);
            mask-image:radial-gradient(circle at 50% 32%,#000 0%,transparent 78%);}
  .spotlight{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(420px circle at var(--x,50%) var(--y,18%), rgba(245,185,66,.10), transparent 62%);}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,40px) scale(1.08)}66%{transform:translate(-25px,20px) scale(.95)}}

  .wrap{max-width:1120px;margin:0 auto;padding:56px 24px 56px;position:relative;z-index:1}
  /* ===== 品牌（透明 logo 悬浮） ===== */
  header{text-align:center;margin-bottom:44px}
  .brand{position:relative;display:inline-block;margin-bottom:18px;animation:floaty 7.5s ease-in-out infinite;isolation:isolate}
  .brand-glow{position:absolute;inset:-12% -9%;z-index:-1;border-radius:50%;
    background:radial-gradient(closest-side,rgba(245,185,66,.22),rgba(78,168,255,.12) 55%,transparent 76%);
    filter:blur(30px);animation:pulse 6s ease-in-out infinite}
  .brand-img{display:block;width:min(410px,76vw);height:auto;user-select:none;-webkit-user-drag:none;
    filter:drop-shadow(0 0 1.2px rgba(0,0,0,.92)) drop-shadow(0 14px 26px rgba(0,0,0,.5)) drop-shadow(0 0 22px rgba(120,170,255,.10));
    transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .brand:hover .brand-img{transform:scale(1.03) translateY(-3px)}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes pulse{0%,100%{opacity:.42;transform:scale(1)}50%{opacity:.72;transform:scale(1.05)}}

  h1{font-size:34px;font-weight:800;letter-spacing:2px;
     background:linear-gradient(100deg,var(--gold2),var(--gold) 28%,var(--blue) 60%,var(--gold2));
     background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
     animation:shifthue 9s linear infinite;filter:drop-shadow(0 4px 20px rgba(245,185,66,.18))}
  @keyframes shifthue{to{background-position:220% 0}}
  .sub{color:var(--muted);margin-top:10px;font-size:15px;letter-spacing:.5px}
  .tag{display:inline-block;margin-top:16px;padding:6px 14px;border:1px solid var(--card-border);border-radius:999px;
       font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.03);backdrop-filter:blur(6px)}
  .tag b{color:var(--gold2);font-weight:700}

  /* ===== 卡片 ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
  .card{position:relative;display:block;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
    padding:24px 22px;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transform:perspective(760px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .22s ease, border-color .35s, box-shadow .35s;
    opacity:0; translate:0 22px; animation:fadeIn .7s ease forwards; will-change:transform}
  .card::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;
    background:linear-gradient(90deg,var(--gold),var(--red),var(--blue));opacity:0;transition:opacity .35s}
  .card:hover{border-color:rgba(245,185,66,.5);
    box-shadow:0 20px 55px -20px rgba(245,185,66,.42), 0 0 0 1px rgba(245,185,66,.16) inset}
  .card:hover::before{opacity:1}

  /* 图标底座 + 渐变线条图标 */
  .icon{position:relative;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,rgba(245,185,66,.16),rgba(78,168,255,.12));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 10px 22px -12px rgba(0,0,0,.6);
    margin-bottom:16px;overflow:hidden;transition:transform .35s, box-shadow .35s}
  .icon::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 30% 0%,rgba(255,255,255,.20),transparent 60%)}
  .icon svg{width:26px;height:26px;position:relative;z-index:1}
  .card:hover .icon{transform:scale(1.09) rotate(-5deg);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 16px 28px -10px rgba(245,185,66,.42)}

  .card h3{font-size:18.5px;font-weight:700;letter-spacing:.5px}
  .card p{color:var(--muted);font-size:13.5px;margin-top:7px;min-height:38px}
  .meta{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
  .chip{font-size:11.5px;padding:4px 10px;border-radius:999px;letter-spacing:.5px;
    background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--card-border)}
  .chip.dash{color:var(--gold2);border-color:rgba(245,185,66,.35)}
  .chip.biz{color:var(--blue);border-color:rgba(78,168,255,.35)}
  .enter{font-size:13.5px;font-weight:600;color:var(--gold2);display:inline-flex;align-items:center;gap:5px;transition:gap .3s}
  .card:hover .enter{gap:10px}
  .enter svg{width:15px;height:15px}

  /* ==========================================================================
     电脑大屏：8 个卡片排成 4 列 × 2 行，正好填满，消除「3+3+2」末行留空。
     为什么必须同时放宽 .wrap：原来 max-width 1120px，内容区只有 1072px，
     硬排 4 列每列仅 253px，标题会贴边、描述挤成三行。
     放宽到 1300px 后每列约 283px，标题可保持单行。
     ≥1240px 才生效：再窄的窗口 4 列会挤成两行标题，退回原来的 auto-fill（3 列）。
     手机端与平板竖屏完全不受影响（它们在 auto-fill 下本来就只有 1 列）。
     ========================================================================== */
  @media (min-width:1240px){
    .wrap{max-width:1300px}
    .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
    /* 4 列下描述基本都是一行，留两行高度会显空；改成一行高度，
       万一某条描述偏长，grid 的 stretch 会自动把同排卡片拉齐，不会参差 */
    .card p{min-height:24px}
    .card{padding:22px 20px}
    .card h3{font-size:17.5px}
  }

  footer{text-align:center;margin-top:54px;color:var(--muted);font-size:12.5px;letter-spacing:.5px}
  footer .line{width:60px;height:1px;background:var(--card-border);margin:0 auto 16px}
  .credit{margin-top:9px;font-size:11.5px;color:rgba(148,163,192,.68);letter-spacing:.3px}
  .credit a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(148,163,192,.28)}
  .credit a:hover{color:var(--gold2);border-color:var(--gold2)}

  @keyframes fadeIn{from{opacity:0;translate:0 22px}to{opacity:1;translate:0 0}}
  .cards .card:nth-child(1){animation-delay:.05s}
  .cards .card:nth-child(2){animation-delay:.12s}
  .cards .card:nth-child(3){animation-delay:.19s}
  .cards .card:nth-child(4){animation-delay:.26s}
  .cards .card:nth-child(5){animation-delay:.33s}
  .cards .card:nth-child(6){animation-delay:.40s}
  .cards .card:nth-child(7){animation-delay:.47s}
  .cards .card:nth-child(8){animation-delay:.54s}

  @media (max-width:520px){h1{font-size:26px}.wrap{padding:42px 18px 44px}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .card{opacity:1;translate:0 0}
    #fx{display:none}
  }
  /* ===== 「添加到桌面」主按钮 =====
     只在「触屏 + 窄屏」出现；电脑端 display:none，连盒子都不占位。
     这条媒体查询是「不影响网页版」的唯一闸门，禁止放宽。 */
  .cta{display:none}
  @media (pointer:coarse) and (max-width:900px){
    /* 2026-11-09：这块已从首屏移到 5 个系统卡片之后，不再抢占业务入口的位置。
       上边距加大到 34px 与卡片列表拉开，并用一条两端渐隐的细线做分隔，
       免得看着像从上面掉下来的一截。闸门本身未改动。 */
    .cta{display:block;margin:34px 0 4px;position:relative}
    .cta::before{content:"";position:absolute;top:-19px;left:3%;right:3%;height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
  }
  .cta[hidden]{display:none!important}
  .cta-b{position:relative;display:flex;align-items:center;gap:13px;width:100%;
    padding:14px 15px;border:0;border-radius:16px;cursor:pointer;text-align:left;font:inherit;
    color:#20160a;overflow:hidden;-webkit-tap-highlight-color:transparent;
    background:linear-gradient(135deg,#ffd88f,#f5b942 58%,#eaa62f);
    box-shadow:0 12px 30px -14px rgba(245,185,66,.75), 0 0 0 1px rgba(255,255,255,.12) inset;
    transition:transform .12s ease, box-shadow .2s}
  .cta-b:active{transform:scale(.982);box-shadow:0 6px 18px -12px rgba(245,185,66,.8)}
  /* 一道缓慢扫过的光：深色背景上"会动"的金色按钮，用户不用找就能看见 */
  .cta-b::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
    transform:skewX(-18deg);animation:sheen 3.6s ease-in-out infinite}
  @keyframes sheen{0%{left:-60%}55%{left:120%}100%{left:120%}}
  .cta-i{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:rgba(26,18,6,.12);border:1px solid rgba(26,18,6,.14)}
  .cta-i svg{width:21px;height:21px;fill:none;stroke:#20160a;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .cta-x{min-width:0;flex:1}
  .cta-x b{display:block;font-size:15.5px;font-weight:800;letter-spacing:.3px;line-height:1.25}
  .cta-x i{display:block;font-style:normal;font-size:11.5px;font-weight:600;
    color:rgba(32,22,10,.68);margin-top:3px;line-height:1.4}
  .cta-a{flex:0 0 auto;opacity:.72}
  .cta-a svg{width:18px;height:18px;fill:none;stroke:#20160a;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round}
  .cta-s{margin-top:9px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.6}
  .cta-s a{color:var(--gold);text-decoration:none;font-weight:700;
    border-bottom:1px solid rgba(245,185,66,.35);padding-bottom:1px}

  /* ===== 「添加到桌面」引导抽屉 ===== */
  .hms{position:fixed;inset:0;z-index:9000;display:flex;align-items:flex-end;justify-content:center}
  .hms[hidden]{display:none}
  .hms-bg{position:absolute;inset:0;background:rgba(3,5,10,.64);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .hms-p{position:relative;width:100%;max-width:520px;background:#0d1320;
    border:1px solid rgba(255,255,255,.1);border-radius:20px 20px 0 0;
    padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
    box-shadow:0 -12px 40px rgba(0,0,0,.6);
    animation:hmsUp .26s cubic-bezier(.22,1,.36,1)}
  @keyframes hmsUp{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
  .hms-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .hms-h b{font-size:16px;letter-spacing:.4px}
  .hms-x{width:30px;height:30px;border:0;background:rgba(255,255,255,.07);border-radius:50%;
    color:var(--muted);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center}
  .hms-x:active{background:rgba(255,255,255,.15)}
  .hms-s{font-size:13px;line-height:1.72;color:var(--muted);margin:0 0 14px}
  .hms-o{margin:0;padding:0;list-style:none;counter-reset:s}
  .hms-o li{counter-increment:s;position:relative;padding-left:30px;font-size:13.5px;
    line-height:1.65;color:#cbd6e8;margin-bottom:11px}
  .hms-o li:last-child{margin-bottom:0}
  .hms-o li::before{content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;
    border-radius:50%;background:rgba(245,185,66,.16);border:1px solid rgba(245,185,66,.4);
    color:var(--gold);font-size:11.5px;font-weight:700;display:grid;place-items:center}
  .hms-btn{width:100%;margin-top:16px;height:46px;border:0;border-radius:13px;
    background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1206;
    font-size:15px;font-weight:800;cursor:pointer}
  .hms-btn:active{transform:scale(.985)}
  .hms-copy{width:100%;margin-top:12px;height:44px;border-radius:13px;cursor:pointer;
    background:rgba(78,168,255,.14);border:1px solid rgba(78,168,255,.36);
    color:#bcd9ff;font-size:14px;font-weight:700}
  .hms-copy:active{background:rgba(78,168,255,.24)}
  .hms-n{font-size:11.5px;line-height:1.65;color:#7d8aa4;margin:12px 0 0}
  body.locked{overflow:hidden}
  @media (prefers-reduced-motion:reduce){ .cta-b::after{display:none} }
</style>
</head>
<body>
  <!-- 图标渐变描边定义 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="icoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#f5b942"/>
      <stop offset="1" stop-color="#4ea8ff"/>
    </linearGradient>
  </defs></svg>

  <div class="bg"></div>
  <canvas id="fx"></canvas>
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
  <div class="grid"></div>
  <div class="spotlight" id="spot"></div>

  <div class="wrap">
    <header>
      <div class="brand">
        <div class="brand-glow"></div>
        <img class="brand-img" src="./brand2.png" alt="陕西交控 × 延长石油" />
      </div>
      <h1>高速延长 · 综合管理平台</h1>
      <div class="sub">业务驾驶舱与系统 · 统一入口</div>
      <div class="tag">共 <b id="cnt">0</b> 个系统 · 一键直达</div>
    </header>

      <main class="cards" id="cards"></main>

      <!-- 「添加到桌面」主按钮：仅手机端渲染，电脑端 display:none 且不占任何空间。
           2026-11-09 从首屏移到 5 个系统卡片之后 —— 原来这块占满首屏，
           把业务入口全挤到折叠线以下；站长进来是进系统，不是来装 App 的。
           位置变了，但是同一个 #cta / #addBtn，JS 逻辑一行没动。 -->
      <section class="cta" id="cta" aria-label="添加到桌面">
        <button class="cta-b" id="addBtn" type="button">
          <span class="cta-i"><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.2" y="3.2" width="7" height="7" rx="2"/>
            <rect x="13.8" y="3.2" width="7" height="7" rx="2"/>
            <rect x="3.2" y="13.8" width="7" height="7" rx="2"/>
            <path d="M17.3 13.4v7.2M13.7 17h7.2"/></svg></span>
          <span class="cta-x">
            <b id="ctaT">添加到桌面</b>
            <i id="ctaS">一键放到手机桌面，下次点图标直达</i>
          </span>
          <span class="cta-a"><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 6 6 6-6 6"/></svg></span>
        </button>
        <div class="cta-s">也可 <a href="app/">下载安卓安装包 v1.2</a>（Android 5.0 及以上）</div>
      </section>

      <footer>
      <div class="line"></div>
      内部导航 · 仅限授权人员访问 · 高速延长非油业务
      <div class="credit">Design by 刘龙伟 · Email: <a href="mailto:liulongwei@126.com">liulongwei@126.com</a></div>
    </footer>
  </div>

<script>
  /* ===== 入口数据：新增/修改在这里改 ===== */
  const SITES = [
    /* 2026-11-05 恢复：陕西高速油站分布（= 陕西高速加油站运营全景看板）
       该站为多用户后端 + 全屏地图布局，手机端不能自适应，版面会错乱。
       处置：只给电脑端显示；手机端（触屏 + 窄屏闸门）不渲染此项，仍保持 5 个入口。
       判定与 .cta 主按钮共用同一条闸门，保证「电脑端多一个、手机端一个都不多」。 */
    { name:"陕西高速油站分布", desc:"服务区分布全景·油站运营总览", cat:"驾驶舱", catType:"dash",
      pcOnly:true,
      url:"https://sx-gas-station-dashboard.app.workbuddy.host",
      icon:'<rect x="3" y="3" width="7" height="9" rx="1.6"/><rect x="14" y="3" width="7" height="5" rx="1.6"/><rect x="14" y="12" width="7" height="9" rx="1.6"/><rect x="3" y="16" width="7" height="5" rx="1.6"/>' },
    { name:"成品油销量驾驶舱", desc:"成品油销量·双口径·站点排行·会计月轨迹", cat:"驾驶舱", catType:"dash",
      url:"https://lvritiann.github.io/youpin-sales-cockpit/",
      icon:'<rect x="3" y="12" width="4.6" height="9" rx="1.2"/><rect x="9.7" y="6" width="4.6" height="15" rx="1.2"/><rect x="16.4" y="9.5" width="4.6" height="11.5" rx="1.2"/>' },
    { name:"非油综合汇总驾驶舱", desc:"非油销售·毛利·全年预测图表视图", cat:"驾驶舱", catType:"dash",
      url:"https://lvritiann.github.io/feiyou-cockpit-web/",
      icon:'<path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>' },
    /* 2026-11-13 新增：油站考核工具（同日按用户口径定名，旧名已全部弃用）。

    { name:"油站考核工具", desc:"目标责任考核·实时人效·在线评分", cat:"业务系统", catType:"biz",
      url:"https://lvritiann.github.io/kaohe-workbench/",
      icon:'<circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="1"/>' },
    { name:"油品管理驾驶舱", desc:"油品损耗监控、分析与预警", cat:"驾驶舱", catType:"dash",
      url:"https://lvritiann.github.io/troleum-loss-dashboard/",
      icon:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>' },
    { name:"进销存管理系统", desc:"进货·销售·库存·盘点一体化管理", cat:"业务系统", catType:"biz",
      url:"https://lvritiann.github.io/jinxiaocun-cockpit/",
      icon:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>' },
    { name:"供应商订货系统", desc:"非油订货·额度管控·到货入库", cat:"业务系统", catType:"biz",
      url:"https://lvritiann.github.io/dinghuo-taizhang/",

    /* 2026-11-13 移到最后一位（原在考核之后），同日改名「非油商品消费结构分析」。
       归属：**业务系统**（不是驾驶舱）—— 它是消费结构分析工具。
       服务跑在局域网 192.168.100.32:8848，出了公司网络就打不开，
       所以标 pcOnly —— 手机端不渲染，免得站长在外面点开一片空白。
       因为它是 pcOnly，放在末尾**不影响手机端顺序**，手机端仍是：
       成品油 → 非油综合 → 考核工具(第3) → 油品管理 → 进销存 → 订货。 */
    { name:"非油商品消费结构分析", desc:"同比环比·品类结构·节日对比（仅局域网）", cat:"业务系统", catType:"biz",
      pcOnly:true,
      url:"http://192.168.100.32:8848/#/cat",
      icon:'<path d="M3 5h18l-7 8v6l-4 2v-8z"/>' }
  ];

  const arrow = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m0 0-6-6m6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  /* 手机端（触屏 + 窄屏）不渲染 pcOnly 入口 —— 与 .cta 主按钮共用同一条闸门，
     保证电脑端有 6 个、手机端仍是 5 个，手机端布局与屏蔽前完全一致。 */
  const IS_MOBILE = window.matchMedia('(pointer:coarse) and (max-width:900px)').matches;
  const SHOWN = SITES.filter(s => !(s.pcOnly && IS_MOBILE));

  const wrap = document.getElementById('cards');
  wrap.innerHTML = SHOWN.map(s => `
    <a class="card" href="${s.url}" target="_blank" rel="noopener noreferrer">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="url(#icoGrad)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg></div>
      <h3>${s.name}</h3>
      <p>${s.desc}</p>
      <div class="meta">
        <span class="chip ${s.catType}">${s.cat}</span>
        <span class="enter">进入系统 ${arrow}</span>
      </div>
    </a>`).join('');
  document.getElementById('cnt').textContent = SHOWN.length;

  /* ===== 减少动效偏好 ===== */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===== 鼠标聚光 + 粒子连线 ===== */
  const spot = document.getElementById('spot');
  const mouse = { x: innerWidth/2, y: 120 };
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    spot.style.setProperty('--x', e.clientX + 'px');
    spot.style.setProperty('--y', e.clientY + 'px');
  }, { passive:true });

  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W, H, ps = [];
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  function resize(){
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const n = Math.min(84, Math.floor(W*H/20000));
    ps = [];
    for (let i=0;i<n;i++) ps.push({ x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.32, vy:(Math.random()-.5)*.32, r:Math.random()*1.5+.5 });
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for (const p of ps){
      p.x += p.vx; p.y += p.vy;
      if (p.x<0||p.x>W) p.vx*=-1;
      if (p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832);
      ctx.fillStyle = 'rgba(180,205,255,.55)'; ctx.fill();
    }
    for (let i=0;i<ps.length;i++){
      const a = ps[i];
      for (let j=i+1;j<ps.length;j++){
        const b = ps[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
        if (d<128){
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
          ctx.strokeStyle = 'rgba(120,170,255,'+(0.13*(1-d/128))+')'; ctx.lineWidth=1; ctx.stroke();
        }
      }
      const dx=a.x-mouse.x, dy=a.y-mouse.y, dm=Math.hypot(dx,dy);
      if (dm<170){
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(mouse.x,mouse.y);
        ctx.strokeStyle = 'rgba(245,185,66,'+(0.20*(1-dm/170))+')'; ctx.lineWidth=1; ctx.stroke();
      }
    }
    requestAnimationFrame(tick);
  }
  if (!reduce){ resize(); tick(); window.addEventListener('resize', resize); }

  /* ===== 卡片 3D 跟随 ===== */
  if (!reduce && matchMedia('(hover:hover)').matches){
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        const rx = ((e.clientY - r.top)/r.height - .5) * -7;
        const ry = ((e.clientX - r.left)/r.width - .5) * 7;
        card.style.setProperty('--rx', rx.toFixed(2)+'deg');
        card.style.setProperty('--ry', ry.toFixed(2)+'deg');
      });
      card.addEventListener('mouseleave', () => {
        card.style.setProperty('--rx','0deg');
        card.style.setProperty('--ry','0deg');
      });
    });
  }
</script>
  <!-- 添加到桌面 · 引导抽屉（默认隐藏，点主按钮展开） -->
  <div class="hms" id="hms" hidden>
    <div class="hms-bg" data-hms-close></div>
    <div class="hms-p" role="dialog" aria-modal="true" aria-labelledby="hmsT">
      <div class="hms-h">
        <b id="hmsT">添加到桌面</b>
        <button class="hms-x" type="button" data-hms-close aria-label="关闭">×</button>
      </div>
      <p class="hms-s" id="hmsS"></p>
      <ol class="hms-o" id="hmsO"></ol>
      <button class="hms-btn" type="button" id="hmsGo" hidden>立即添加</button>
      <button class="hms-copy" type="button" id="hmsCopy" hidden>复制网址，去浏览器打开</button>
      <p class="hms-n" id="hmsN"></p>
    </div>
  </div>

  <script>
  /* ===== 「添加到桌面」引导 =====
     网页没有权限直接把图标写进系统桌面，能做的只有两件事：
       ① 浏览器支持 PWA 安装（Chromium 系）→ 直接调起原生安装框，一键完成；
       ② 不支持 → 识别「具体是哪一个浏览器」，给出它菜单里那一项的确切名字。
     权限：不需要任何系统权限，也不需要额外配置；前提只有 HTTPS（Pages 已满足）。 */
  (function () {
    var ua = navigator.userAgent || '';
    var isWX      = /MicroMessenger/i.test(ua);
    var isQQ      = /QQ\//i.test(ua) && !isWX;
    var isHarmony = /HarmonyOS|OpenHarmony|ArkWeb/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    var isNEXT    = isHarmony && !isAndroid;   // 纯血鸿蒙：UA 里有 HarmonyOS 但没有 Android
    var isIOS     = /iPad|iPhone|iPod/i.test(ua) && !window.MSStream;

    var btn  = document.getElementById('addBtn');
    var cta  = document.getElementById('cta');
    var btEl = document.getElementById('ctaT');
    var bsEl = document.getElementById('ctaS');
    var box  = document.getElementById('hms');
    var tEl  = document.getElementById('hmsT');
    var sEl  = document.getElementById('hmsS');
    var oEl  = document.getElementById('hmsO');
    var goEl = document.getElementById('hmsGo');
    var cpEl = document.getElementById('hmsCopy');
    var nEl  = document.getElementById('hmsN');
    if (!btn || !box) return;

    /* 已经是从桌面图标进来的（独立窗口）→ 这个按钮没有意义，直接藏掉 */
    try {
      if (window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches ||
          navigator.standalone === true) { if (cta) cta.hidden = true; }
    } catch (e) { /* 老浏览器不支持 matchMedia，按未安装处理 */ }

    var deferred = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
    });

    /* 浏览器识别：menu = 菜单按钮长什么样，add = 菜单里那一项叫什么 */
    function pick() {
      if (isWX) return { k: 'wx', menu: '右上角「···」', add: '在浏览器打开', name: '微信' };
      if (isQQ) return { k: 'qq', menu: '右上角「···」', add: '在浏览器打开', name: 'QQ' };
      if (isIOS) return { k: 'ios', menu: '底部「分享」', add: '添加到主屏幕', name: 'Safari' };
      if (/HuaweiBrowser/i.test(ua)) return { k: 'hw', menu: '底部「三」或右上角「···」', add: '添加到桌面', name: '华为浏览器' };
      if (/EdgA|EdgiOS|Edg\//i.test(ua)) return { k: 'edge', menu: '底部「···」', add: '添加到手机', name: 'Edge' };
      if (/SamsungBrowser/i.test(ua)) return { k: 'ss', menu: '底部「≡」', add: '添加页面到 → 主屏幕', name: '三星浏览器' };
      if (/MiuiBrowser|XiaoMi|MiBro/i.test(ua)) return { k: 'mi', menu: '底部「≡」', add: '添加到桌面', name: '小米浏览器' };
      if (/VivoBrowser|HeyTapBrowser|OppoBrowser/i.test(ua)) return { k: 'ov', menu: '底部「≡」', add: '添加到桌面', name: 'OPPO/vivo 浏览器' };
      if (/UCBrowser|MQQBrowser|QQBrowser|Quark/i.test(ua)) return { k: 'uc', menu: '底部「≡」', add: '添加到桌面', name: 'UC/QQ 浏览器' };
      if (/Firefox|FxiOS/i.test(ua)) return { k: 'ff', menu: '右上角「⋮」', add: '添加到主屏幕', name: 'Firefox' };
      if (/CriOS|Chrome/i.test(ua)) return { k: 'cr', menu: '右上角「⋮」', add: '添加到主屏幕 / 安装应用', name: 'Chrome' };
      return { k: 'ot', menu: '浏览器菜单', add: '添加到桌面', name: '当前浏览器' };
    }
    var b = pick();

    /* 主按钮文案随平台微调，iOS 说「主屏幕」才是系统原话 */
    if (btEl && isIOS) btEl.textContent = '添加到主屏幕';
    if (bsEl) {
      if (isNEXT) bsEl.textContent = '纯血鸿蒙免安装，放到桌面当 App 用';
      else if (isIOS) bsEl.textContent = '从 Safari 分享菜单一步放到主屏幕';
      else if (isWX) bsEl.textContent = '需先转到浏览器，按提示两步完成';
    }

    function scenario() {
      /* 微信 / QQ 内置浏览器：不给添加，先教换浏览器，并给一键复制网址 */
      if (isWX || isQQ) return {
        t: '请先在浏览器中打开',
        s: b.name + ' 内置浏览器不允许把网页放到桌面。换到系统浏览器只需两步：',
        o: ['点' + b.menu + '，选「' + b.add + '」',
            '在系统浏览器里打开本页，再点一次顶部的「添加到桌面」'],
        copy: true,
        n: '也可以点下面的按钮复制网址，粘贴到 Chrome、Edge 或手机自带浏览器里打开。'
      };
      /* iOS 只有 Safari 能添加 */
      if (isIOS) return {
        t: '添加到主屏幕',
        s: 'iPhone / iPad 只能用 Safari 添加。请确认当前是 Safari（不是微信、不是 Chrome）：',
        o: ['点屏幕最下方的「分享」按钮（方框带向上箭头）',
            '在弹出菜单里往下找，选「添加到主屏幕」',
            '右上角点「添加」，桌面就会出现图标'],
        n: '如果没看到「添加到主屏幕」，把菜单滑到底 →「编辑操作」→ 把它加回来。'
      };

      var base = [
        '点' + b.menu + '，打开浏览器菜单',
        '选「' + b.add + '」' + (isNEXT ? '（部分版本叫「添加到主屏幕」）' : ''),
        '桌面出现图标，点开即全屏进入平台'
      ];

      if (isNEXT) return {
        t: '添加到桌面（纯血鸿蒙）',
        s: '本机是 HarmonyOS NEXT，装不了安卓安装包——这是系统限制，与安装包无关。用「添加到桌面」得到的效果几乎一样：独立图标、全屏、无地址栏。',
        o: base,
        n: '推荐系统自带浏览器或 Chrome；华为浏览器部分版本里这一项叫「添加到主屏幕」。'
      };
      if (isHarmony) return {
        t: '添加到桌面（鸿蒙）',
        s: '本机是可以装安卓应用的鸿蒙。两种方式都行——装 App 功能最全；添加到桌面更轻，网页更新后图标自动跟着更新：',
        o: base,
        n: '已识别浏览器：' + b.name
      };
      if (isAndroid) return {
        t: '添加到桌面',
        s: '不用下载安装包，直接把平台放到桌面，点开就是全屏，和 App 几乎一样：',
        o: base,
        n: '已识别浏览器：' + b.name + '。若菜单里找不到这一项，换 Chrome 或 Edge 再试。'
      };
      return {
        t: '添加到桌面',
        s: '请用手机浏览器打开本页，再按下面两步操作：',
        o: base,
        n: '已识别浏览器：' + b.name
      };
    }

    function open() {
      var c = scenario();
      tEl.textContent = c.t;
      sEl.textContent = c.s;
      oEl.innerHTML = c.o.map(function (x) { return '<li>' + x + '</li>'; }).join('');
      goEl.hidden = !deferred;          // 只有能原生一键安装时才露出这个按钮
      cpEl.hidden = !c.copy;
      nEl.textContent = c.n || '';
      nEl.hidden = !c.n;
      box.hidden = false;
      document.body.classList.add('locked');
    }
    function close() {
      box.hidden = true;
      document.body.classList.remove('locked');
    }

    btn.addEventListener('click', open);
    box.addEventListener('click', function (e) {
      if (e.target.hasAttribute('data-hms-close')) close();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !box.hidden) close();
    });
    goEl.addEventListener('click', function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function () { deferred = null; goEl.hidden = true; close(); });
    });

    /* 微信里没有「复制网址」的话，用户经常卡在"怎么把链接弄到浏览器"这一步 */
    function copyFallback(u) {
      var ta = document.createElement('textarea');
      ta.value = u;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, u.length);
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
    cpEl.addEventListener('click', function () {
      var url = location.origin + location.pathname;
      var done = function () { cpEl.textContent = '已复制，去浏览器粘贴打开'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, function () { copyFallback(url); done(); });
      } else {
        copyFallback(url);
        done();
      }
    });
  })();
  </script>
