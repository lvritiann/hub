<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>高速延长 · 综合管理平台</title>
<meta name="description" content="高速延长公司非油业务驾驶舱与系统统一入口" />
<style>
  :root{
    --bg:#060912;
    --bg2:#0a0f1f;
    --text:#e8edf7;
    --muted:#94a3c0;
    --gold:#f5b942;
    --gold2:#ffd27a;
    --blue:#4ea8ff;
    --card:rgba(255,255,255,.045);
    --card-border:rgba(255,255,255,.09);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  /* 背景：极光 + 网格 */
  .bg{position:fixed;inset:0;z-index:-2;background:
      radial-gradient(1200px 700px at 15% -10%, rgba(245,185,66,.14), transparent 60%),
      radial-gradient(1000px 700px at 95% 10%, rgba(78,168,255,.14), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg2));}
  .blob{position:fixed;z-index:-2;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 18s ease-in-out infinite}
  .blob.a{width:420px;height:420px;left:-80px;top:-60px;background:radial-gradient(circle,rgba(245,185,66,.5),transparent 70%)}
  .blob.b{width:480px;height:480px;right:-120px;top:40px;background:radial-gradient(circle,rgba(78,168,255,.45),transparent 70%);animation-delay:-6s}
  .blob.c{width:360px;height:360px;left:40%;bottom:-140px;background:radial-gradient(circle,rgba(120,90,255,.32),transparent 70%);animation-delay:-11s}
  .grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(circle at 50% 35%,#000 0%,transparent 78%);
            mask-image:radial-gradient(circle at 50% 35%,#000 0%,transparent 78%);}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,40px) scale(1.08)}66%{transform:translate(-25px,20px) scale(.95)}}

  .wrap{max-width:1120px;margin:0 auto;padding:64px 24px 56px}
  /* 头部 */
  header{text-align:center;margin-bottom:48px;animation:fadeUp .8s ease both}
  .logo{width:64px;height:64px;margin:0 auto 18px;display:block;filter:drop-shadow(0 6px 18px rgba(245,185,66,.35))}
  h1{font-size:34px;font-weight:800;letter-spacing:2px;
     background:linear-gradient(100deg,var(--gold2),var(--gold) 45%,var(--blue));
     -webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--muted);margin-top:10px;font-size:15px;letter-spacing:.5px}
  .tag{display:inline-block;margin-top:16px;padding:6px 14px;border:1px solid var(--card-border);border-radius:999px;
       font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.03);backdrop-filter:blur(6px)}
  .tag b{color:var(--gold2);font-weight:700}

  /* 卡片网格 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
  .card{position:relative;display:block;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
    padding:24px 22px;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s;
    animation:fadeUp .8s ease both;}
  .card::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;
    background:linear-gradient(90deg,var(--gold),var(--blue));opacity:.0;transition:opacity .35s}
  .card:hover{transform:translateY(-7px);border-color:rgba(245,185,66,.5);
    box-shadow:0 18px 50px -18px rgba(245,185,66,.45),0 0 0 1px rgba(245,185,66,.18) inset}
  .card:hover::before{opacity:1}
  .icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(245,185,66,.18),rgba(78,168,255,.16));
    border:1px solid var(--card-border);margin-bottom:16px;color:var(--gold2)}
  .icon svg{width:24px;height:24px}
  .card h3{font-size:18.5px;font-weight:700;letter-spacing:.5px}
  .card p{color:var(--muted);font-size:13.5px;margin-top:7px;min-height:38px}
  .meta{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
  .chip{font-size:11.5px;padding:4px 10px;border-radius:999px;letter-spacing:.5px;
    background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--card-border)}
  .chip.dash{color:var(--gold2);border-color:rgba(245,185,66,.35)}
  .chip.biz{color:var(--blue);border-color:rgba(78,168,255,.35)}
  .enter{font-size:13.5px;font-weight:600;color:var(--gold2);display:inline-flex;align-items:center;gap:5px;transition:gap .3s}
  .card:hover .enter{gap:10px}
  .enter svg{width:15px;height:15px}

  footer{text-align:center;margin-top:54px;color:var(--muted);font-size:12.5px;letter-spacing:.5px;animation:fadeUp 1s ease both}
  footer .line{width:60px;height:1px;background:var(--card-border);margin:0 auto 16px}

  @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
  .cards .card:nth-child(1){animation-delay:.05s}
  .cards .card:nth-child(2){animation-delay:.12s}
  .cards .card:nth-child(3){animation-delay:.19s}
  .cards .card:nth-child(4){animation-delay:.26s}
  .cards .card:nth-child(5){animation-delay:.33s}
  .cards .card:nth-child(6){animation-delay:.40s}
  .cards .card:nth-child(7){animation-delay:.47s}
  .cards .card:nth-child(8){animation-delay:.54s}

  @media (max-width:520px){h1{font-size:26px}.wrap{padding:46px 18px 44px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.blob{animation:none}}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
  <div class="grid"></div>

  <div class="wrap">
    <header>
      <svg class="logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
          <stop stop-color="#ffd27a"/><stop offset="1" stop-color="#f5b942"/></linearGradient></defs>
        <path d="M32 4 56 17.5v29L32 60 8 46.5v-29L32 4Z" stroke="url(#lg)" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M22 40V24l20 16V24" stroke="#4ea8ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="32" cy="32" r="3" fill="#ffd27a"/>
      </svg>
      <h1>高速延长 · 综合管理平台</h1>
      <div class="sub">业务驾驶舱与系统 · 统一入口</div>
      <div class="tag">共 <b id="cnt">0</b> 个系统 · 一键直达</div>
    </header>

    <main class="cards" id="cards"></main>

    <footer>
      <div class="line"></div>
      内部导航 · 仅限授权人员访问 · 高速延长非油业务
    </footer>
  </div>

<script>
  // ===== 系统入口数据：新增/修改在这里改即可 =====
  const SITES = [
    {
      name:"综合看板主站",
      desc:"加油站综合业务总驾驶舱（多用户后端）",
      cat:"驾驶舱", catType:"dash",
      url:"https://sx-gas-station-dashboard.app.workbuddy.host",
      icon:'<path d="M4 13h7V4H4v9Zm9 7h7V4h-7v16Zm9 0h7V9h-7v11ZM4 20h7v-4H4v4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
    },
    {
      name:"非油销售预测",
      desc:"非油销量预测与任务申报系统",
      cat:"驾驶舱", catType:"dash",
      url:"https://nonoil-forecast-42019.app.workbuddy.host",
      icon:'<path d="M4 19V5m0 14h16M8 15l4-5 3 3 5-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    },
    {
      name:"非油销售汇总驾驶舱",
      desc:"非油销售·毛利·全年预测图表视图",
      cat:"驾驶舱", catType:"dash",
      url:"https://lvritiann.github.io/feiyou-cockpit-web/",
      icon:'<path d="M12 3a9 9 0 1 0 9 9h-9V3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 3v9h9" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
    },
    {
      name:"进销存管理系统",
      desc:"进货·销售·库存·盘点一体化管理",
      cat:"业务系统", catType:"biz",
      url:"https://lvritiann.github.io/jinxiaocun-cockpit/",
      icon:'<path d="M3 8 12 3l9 5v13H3V8Zm3 0v13m12-13v13M3 8h18" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
    },
    {
      name:"油品损耗驾驶舱",
      desc:"油品损耗监控、分析与预警",
      cat:"驾驶舱", catType:"dash",
      url:"https://lvritiann.github.io/troleum-loss-dashboard/",
      icon:'<path d="M12 3s6 6.5 6 11a6 6 0 1 1-12 0c0-4.5 6-11 6-11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 14a2.5 2.5 0 0 0 2.5 2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
    },
    {
      name:"供应商订货台账",
      desc:"非油订货·额度管控·到货入库",
      cat:"业务系统", catType:"biz",
      url:"https://lvritiann.github.io/dinghuo-taizhang/",
      icon:'<path d="M3 7h11v10H3V7Zm11 3h4l3 3v4h-7V10ZM7 10h1m-1 3h1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    }
  ];

  const arrow = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m0 0-6-6m6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const wrap = document.getElementById('cards');
  wrap.innerHTML = SITES.map(s => `
    <a class="card" href="${s.url}" target="_blank" rel="noopener noreferrer">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none">${s.icon}</svg></div>
      <h3>${s.name}</h3>
      <p>${s.desc}</p>
      <div class="meta">
        <span class="chip ${s.catType}">${s.cat}</span>
        <span class="enter">进入系统 ${arrow}</span>
      </div>
    </a>`).join('');
  document.getElementById('cnt').textContent = SITES.length;
</script>
</body>
</html>
